// 国内镜像仓库（阿里云）。
// Capacitor 插件的 buildscript 只声明 google()/mavenCentral()，不继承根项目的镜像配置，
// 通过本 init 脚本把这些仓库注入所有项目，避免从境外仓库拉依赖时 TLS 握手被中断。
allprojects {
    buildscript {
        repositories {
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
        }
    }
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}
