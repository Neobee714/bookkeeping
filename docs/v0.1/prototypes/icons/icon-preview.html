<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>双人记账 APP 图标预览</title>
<style>
  body { background:#1E1E1E; color:#fff; font-family: "Microsoft YaHei", sans-serif; margin:0; padding:40px; }
  h1 { text-align:center; font-size:22px; margin-bottom:8px; }
  p.sub { text-align:center; color:#9a93a8; margin-bottom:40px; }
  .grid { display:flex; justify-content:center; gap:60px; flex-wrap:wrap; }
  .card { text-align:center; }
  .card img { width:160px; height:160px; border-radius:36px; box-shadow:0 10px 30px rgba(0,0,0,.5); display:block; margin-bottom:14px; }
  .card .name { font-size:16px; font-weight:600; margin-bottom:4px; }
  .card .desc { font-size:13px; color:#b9b2c9; max-width:200px; }
  .thumb-row { display:flex; justify-content:center; gap:24px; margin-top:50px; }
  .thumb-row .thumb { text-align:center; }
  .thumb-row img { width:48px; height:48px; border-radius:10px; }
  .thumb-row span { display:block; font-size:11px; color:#8e86a2; margin-top:6px; }
</style>
</head>
<body>
  <h1>双人记账 APP 图标 · 三款方案</h1>
  <p class="sub">活力渐变风格(紫 #8B5CF6 → 粉 #EC4899),选定后转全套 Android 图标并集成 APK</p>

  <div class="grid">
    <div class="card">
      <img src="icons/icon-a-double.png" alt="双人">
      <div class="name">A · 双人</div>
      <div class="desc">两个相扣圆环(链环式互扣,一环在前一环在后)——代表两个人一起记账</div>
    </div>
    <div class="card">
      <img src="icons/icon-b-ledger.png" alt="账本">
      <div class="name">B · 账本</div>
      <div class="desc">白色账本 + 琥珀色书签线——记账本意象,识别度高</div>
    </div>
    <div class="card">
      <img src="icons/icon-c-coin.png" alt="钱币">
      <div class="name">C · 钱币</div>
      <div class="desc">白色硬币 + 渐变 ¥ 符号——钱的意象,直观</div>
    </div>
  </div>

  <div class="thumb-row">
    <div class="thumb"><img src="icons/_thumb-icon-a-double.png" alt="A小尺寸"><span>48px A</span></div>
    <div class="thumb"><img src="icons/_thumb-icon-b-ledger.png" alt="B小尺寸"><span>48px B</span></div>
    <div class="thumb"><img src="icons/_thumb-icon-c-coin.png" alt="C小尺寸"><span>48px C</span></div>
  </div>
  <p class="sub" style="margin-top:20px;">上面一排为 512px 效果,下面一排为 48px 小尺寸效果(桌面实际大小)</p>
</body>
</html>
