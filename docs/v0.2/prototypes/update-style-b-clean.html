<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>更新弹窗原型 B · 简约清新</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#eef2f7;display:flex;gap:40px;align-items:flex-start;justify-content:center;padding:40px 20px;flex-wrap:wrap}
  .phone{width:360px;background:#f8fafc;border-radius:36px;border:8px solid #cbd5e1;overflow:hidden;box-shadow:0 20px 60px rgba(30,60,90,.18)}
  .status{height:28px;background:#f8fafc;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:11px;color:#94a3b8}
  .screen{background:#f1f5f9;min-height:640px;position:relative;display:flex;align-items:center;justify-content:center}
  .modal{width:86%;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 30px rgba(15,23,42,.10);animation:pop .25s ease}
  @keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
  .head{display:flex;align-items:center;gap:12px;padding:18px 18px 0}
  .appicon{width:44px;height:44px;border-radius:10px;background:#e0f2fe;display:flex;align-items:center;justify-content:center;font-size:22px}
  .head h2{font-size:15px;color:#0f172a;font-weight:600}
  .head .v{font-size:11px;color:#2563eb;background:#eff6ff;border:1px solid #bfdbfe;padding:1px 8px;border-radius:999px;margin-top:3px;display:inline-block}
  .body{padding:14px 18px 18px}
  .meta{display:flex;gap:14px;font-size:11.5px;color:#64748b;margin-bottom:10px}
  .changelog{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:11px 13px;max-height:110px;overflow-y:auto}
  .changelog .t{font-size:11px;font-weight:600;color:#475569;margin-bottom:5px;letter-spacing:.5px}
  .changelog ul{list-style:none}
  .changelog li{font-size:12px;color:#475569;line-height:1.9;padding-left:12px;position:relative}
  .changelog li::before{content:"•";position:absolute;left:0;color:#2563eb}
  .actions{display:flex;gap:8px;margin-top:14px}
  .btn{flex:1;padding:11px 0;border-radius:10px;font-size:13px;font-weight:600;text-align:center;cursor:pointer;border:none}
  .btn-primary{background:#2563eb;color:#fff}
  .btn-ghost{background:#f1f5f9;color:#475569}
  .force-tip{text-align:center;font-size:11px;color:#dc2626;font-weight:600;margin-top:9px}
  .perm{width:86%;background:#fff;border-radius:14px;padding:16px;box-shadow:0 6px 24px rgba(15,23,42,.08)}
  .perm .row{display:flex;gap:11px;align-items:center}
  .perm .ic{width:38px;height:38px;border-radius:9px;background:#fee2e2;color:#dc2626;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
  .perm h4{font-size:13.5px;color:#0f172a}
  .perm p{font-size:11.5px;color:#64748b;margin-top:3px;line-height:1.6}
  .perm .btn{width:100%;margin-top:13px}
  .label{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;font-weight:600}
  .seg{position:absolute;bottom:18px;left:16px;right:16px;display:flex;gap:8px}
  .seg button{flex:1;padding:9px 0;border-radius:9px;border:1.5px solid #cbd5e1;background:#fff;color:#475569;font-size:12px;font-weight:600;cursor:pointer}
  .seg button.on{background:#2563eb;color:#fff;border:none}
  .hint{width:340px;color:#64748b;font-size:13px;line-height:1.9;padding-top:6px}
  .hint b{color:#0f172a}
</style>
</head>
<body>

<div class="hint">
  <b>原型 B · 简约清新</b><br>
  扁平化蓝白风格：白卡片 + 蓝强调色 + 细边框圆角，克制不花哨。<br><br>
  弹窗分「可选更新」与「强制更新」两种状态，点击下方按钮切换；点「立即更新」查看权限引导卡。
</div>

<div class="phone">
  <div class="status"><span>9:41</span><span>📶 🔋</span></div>
  <div class="screen">
    <div class="label"><span>App 首页（简洁风）</span><span>v2.0.0</span></div>
    <div class="modal">
      <div class="head">
        <div class="appicon">📒</div>
        <div>
          <h2 id="titleB">发现新版本</h2>
          <span class="v" id="verB">v2.0.0</span>
        </div>
      </div>
      <div class="body">
        <div class="meta"><span>大小 72.5 MB</span><span>更新 2026-08-16</span></div>
        <div class="changelog">
          <div class="t">更新内容</div>
          <ul>
            <li>全新原生体验，启动更快更流畅</li>
            <li>支持在线更新，以后升级不用重装</li>
            <li>修复已知问题，优化界面细节</li>
          </ul>
        </div>
        <div class="actions">
          <button class="btn btn-ghost" id="laterB" onclick="alert('稍后：本次启动不再提醒')">稍后</button>
          <button class="btn btn-primary" onclick="alert('开始下载 → 通知栏进度 → 自动弹出安装')">立即更新</button>
        </div>
        <div class="force-tip" id="forceB" style="display:none">此版本为强制更新</div>
      </div>
    </div>
  </div>
  <div class="seg">
    <button id="optB" class="on" onclick="setModeB(false)">可选更新</button>
    <button id="forB" onclick="setModeB(true)">强制更新</button>
  </div>
</div>

<div class="phone">
  <div class="status"><span>9:41</span><span>📶 🔋</span></div>
  <div class="screen">
    <div class="label"><span>权限引导</span><span>v2.0.0</span></div>
    <div class="perm">
      <div class="row">
        <div class="ic">⚙</div>
        <div>
          <h4>允许安装未知来源应用</h4>
          <p>更新需要安装新版本，请前往系统设置开启允许，再返回继续更新。</p>
        </div>
      </div>
      <button class="btn btn-primary" onclick="alert('跳转系统设置')">去开启</button>
    </div>
  </div>
</div>

<script>
  function setModeB(force){
    document.getElementById('optB').className = force ? '' : 'on';
    document.getElementById('forB').className = force ? 'on' : '';
    document.getElementById('laterB').style.display = force ? 'none' : '';
    document.getElementById('forceB').style.display = force ? '' : 'none';
    document.getElementById('titleB').textContent = force ? '必须更新到新版本' : '发现新版本';
  }
</script>
</body>
</html>
